version: '3.8'

services:
  # ─── MongoDB Database ────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: krishi_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=krishi_ai
    volumes:
      - mongo_data:/data/db
    networks:
      - krishi_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── FastAPI Backend & ML Services ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: krishi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_RELOAD=false
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=krishi_ai
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-krishi_ai_super_secret_jwt_key_change_in_production_32chars}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:80
      - CROP_MODEL_PATH=/app/ml-models/crop-recommendation/crop_model.joblib
      - DISEASE_MODEL_DIR=/app/ml-models/disease-detection
    volumes:
      - ./ml-models:/app/ml-models:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - krishi_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── React Frontend & Nginx Reverse Proxy ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: krishi_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - krishi_network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  krishi_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
